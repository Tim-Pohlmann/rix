name: rix (on CI failure)
on:
  workflow_run:
    workflows: ["CI"] # change "CI" to the name: of the workflow rix should react to
    types: [completed]
# One rix run per branch at a time: when CI fails again while rix is still working on the
# previous failure, the second run waits instead of starting a second agent from the same tip.
concurrency:
  group: rix-on-ci-failure-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false
jobs:
  rix:
    # Cheap short-circuit; on-ci-failure.yml re-checks both conditions via the API regardless. The
    # head_repository check keeps runs from forks' pull requests out: their code and logs would
    # reach an agent holding this repo's write token, and anyone can push to a fork.
    if: >-
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    uses: Tim-Pohlmann/rix/.github/workflows/on-ci-failure.yml@__RIX_REF__
    with:
      # repo defaults to the calling repo.
      run-id: ${{ github.event.workflow_run.id }}
    secrets:
      read-token: ${{ secrets.RIX_READ_TOKEN }}
      write-token: ${{ secrets.RIX_WRITE_TOKEN }}
