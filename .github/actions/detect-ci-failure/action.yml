name: Detect rix CI failure
description: >-
  Checks whether a specific workflow run failed in a way rix should answer and, if it did, writes
  the prompt a coding agent would answer it with to ./out/prompt.md. Runs no agent, clones nothing,
  and needs only a read token — everything it touches is read-only, which is what lets the answer
  it produces be trusted by a later job that the agent's own machine cannot write to.

inputs:
  repo:
    description: Target GitHub repo (owner/name) that produced the run
    required: true
  run-id:
    description: ID of the (possibly failed) workflow run to inspect
    required: true
  read-token:
    description: GitHub PAT with read access to the target repo, including Actions:read
    required: true
  max-rix-commits:
    description: >-
      How many of rix's own commits may already sit at the failing branch's tip before the failure
      is left alone instead of answered (default: 5). Bounds rix reacting to the CI failures of its
      own fixes forever; a commit by anyone else at the tip clears the count.
    required: false
  rix-version:
    description: "Rix release tag to download, or 'latest'"
    required: false
  rix-bin:
    description: "Path to an already-built rix binary to use instead of downloading a release"
    required: false

outputs:
  should-run:
    description: >-
      'true' if the run failed and rix should answer it (out/prompt.md was written), 'false'
      otherwise — the run didn't fail, it belongs to a fork, the loop guard stood down, or the
      check itself errored.
    value: ${{ steps.detect.outputs.should-run }}
  branch:
    description: >-
      The failing run's branch, and the only branch the answer to this failure may be pushed to.
      Read here rather than from anything the agent's run produces: this job holds no write token
      and runs before the agent exists, so a later privileged job comparing a push target against
      it is comparing against a value the agent had no way to influence. Empty unless should-run
      is 'true'.
    value: ${{ steps.detect.outputs.branch }}

runs:
  using: composite
  steps:
    # download-rix rather than prepare-rix-env: this check runs no agent, so it needs neither Node
    # nor the agent's token/timeout budget - only the binary.
    - name: Download rix
      uses: ./.github/actions/download-rix
      with:
        rix-version: ${{ inputs.rix-version }}
        rix-bin: ${{ inputs.rix-bin }}

    - name: Run rix ci-failure
      id: detect
      env:
        RIX_READ_TOKEN: ${{ inputs.read-token }}
        RIX_REPO: ${{ inputs.repo }}
        RIX_RUN_ID: ${{ inputs.run-id }}
        RIX_MAX_RIX_COMMITS: ${{ inputs.max-rix-commits }}
      shell: bash
      run: |
        mkdir -p out

        # A caller who omits max-rix-commits reaches here with "0", not empty: it arrives through a
        # workflow_call input of type: number with no default, the same quirk prepare-rix-env
        # normalizes away for max-tokens/timeout. 0 is the one value MaxRixCommits rejects, so
        # forwarding it unchanged failed every unconfigured run before it looked at any CI. Only
        # that exact value is treated as unset, so rix's own default applies; anything else invalid
        # (negative, non-numeric) still goes through for rix to report, rather than being masked by
        # a default here. This has to be done in the shell rather than with `|| ''` on the
        # expression above, because a composite action's inputs are strings and the non-empty
        # string "0" is truthy.
        if [ "${RIX_MAX_RIX_COMMITS:-}" = "0" ]; then
          export RIX_MAX_RIX_COMMITS=""
        fi

        # Workflow commands (::error::...) read %/CR/LF as control syntax, so any of those in a
        # message straight from rix's JSON output (attacker-influenced, since it can echo failing
        # test/log content) could break the command or inject another one. Percent-encode them.
        escape_workflow_command() {
          local s=${1//'%'/'%25'}
          s=${s//$'\r'/'%0D'}
          echo "${s//$'\n'/'%0A'}"
        }

        # rix ci-failure always prints its JSON result to stdout, on every exit code (see
        # Startup.ExecuteCiFailureAsync) - capture it before deciding, rather than letting a
        # non-zero exit short-circuit under errexit before it can be read.
        set +e
        result=$("$RIX_BIN" ci-failure --output-dir out)
        exit_code=$?
        set -e

        # One jq call over the already-in-memory $result, rather than a separate subprocess per
        # field - status/outcome/error are all read from it below.
        #
        # read splits on IFS, but a tab counts as IFS *whitespace*, so a run of tabs collapses into
        # one separator and an empty field shifts every later one left. Most results leave most of
        # these fields unset - an untrustedRun carries no outcome or error - so splitting on tabs
        # would read the branch as the outcome and leave the fields each message actually prints
        # empty. Translate the separators to a non-whitespace character, which read keeps one for
        # one; @tsv has already escaped any tab inside a field value, so only true separators are
        # converted.
        IFS=$'\037' read -r status outcome error branch rix_commits head_repo \
          < <(jq -r '[.status, (.outcome // ""), (.error // ""), (.branch // ""), (.rixCommits // ""), (.headRepo // "")] | @tsv' <<<"$result" | tr '\t' '\037')
        # Default to false so every branch below (including an unrecognized status) leaves
        # should-run in a defined state; only the detected branch needs to override it.
        echo "should-run=false" >> "$GITHUB_OUTPUT"
        case "$status" in
          detected)
            # The one case the agent runs for. The branch goes out alongside it because the job
            # that answers this failure may push nowhere else, and this is the last point at which
            # that name is known to be untouched by the answer.
            #
            # Written in the plain key=value form without a heredoc delimiter, deliberately: a git
            # ref name cannot contain a newline (git rejects control characters outright), so there
            # is no value here that could close the assignment early and forge a second output.
            # That is also why the prompt - the one field built from the failing run's own log
            # output, and therefore the one with no bound on its content - travels as a file rather
            # than through here.
            echo "should-run=true" >> "$GITHUB_OUTPUT"
            echo "branch=$branch" >> "$GITHUB_OUTPUT"
            ;;
          skipped)
            echo "Run $RIX_RUN_ID ended '$outcome', not 'failed' — skipping."
            ;;
          untrustedRun)
            # Not an error either: the run belongs to a fork's PR, so its code and logs are written
            # by someone who needs no write access here - rix does not hand those to an agent
            # holding this repo's write token.
            #
            # Escaped for the reason spelled out on the loopGuarded arm below, and more sharply
            # here: on a fork's PR the branch name is picked by the very person this arm exists to
            # keep out, so it is the one ref name an attacker chooses outright.
            echo "::notice::$(escape_workflow_command "Run $RIX_RUN_ID is from '$head_repo', not this repository — not answering a failure on a fork's branch '$branch'.")"
            ;;
          loopGuarded)
            # Not an error: rix has already had its turns on this branch and is standing down so a
            # human can look. Their next commit to the branch clears the streak on its own.
            #
            # Escaped like the ::error:: arms below, for the same reason: $branch is a ref name
            # from the target repo, and git allows '%' in one, so a branch called '...%0A::error::'
            # would otherwise end this notice early and run a workflow command of its author's
            # choosing - in the one job here whose word anything later is allowed to trust.
            echo "::notice::$(escape_workflow_command "The last $rix_commits commits on '$branch' are rix's own — not answering this failure. Push a commit to the branch (or raise max-rix-commits) to re-enable rix on it.")"
            ;;
          error)
            echo "::error::$(escape_workflow_command "$error")"
            ;;
          *)
            # Reached when rix printed a status no branch above names. Within this repo
            # tests/scripts/ci-failure-status.bats fails on that, so in practice this means either
            # output that isn't a result at all, or a released binary newer than the action calling
            # it. Either way rix may well have exited 0 - a newer binary emitting a status this
            # action has not learned yet has succeeded on its own terms - so set a failing code
            # rather than inheriting it, or the job goes green having answered nothing.
            echo "::error::$(escape_workflow_command "rix ci-failure did not produce a usable result: $result")"
            exit_code=1
            ;;
        esac

        exit "$exit_code"
