name: Run rix agent
description: >-
  Runs `rix agent` against a target repo, writing result.json and any git bundles to ./out.

inputs:
  repo:
    description: Target GitHub repo (owner/name)
    required: true
  prompt:
    description: >-
      Task prompt for the coding agent. Required unless prompt-artifact is given.
    required: false
  prompt-artifact:
    description: >-
      Name of an artifact holding the task prompt as prompt.md, given instead of prompt. For a
      prompt that was built in an earlier job — rix ci-failure's, say, which is assembled from a
      failing run's log output and so is both long and arbitrary. A file crosses a job boundary as
      an artifact without a size cap, and without its content ever having to survive being quoted
      through a job output.
    required: false
  read-token:
    description: GitHub PAT (or equivalent token) with read access to the target repo
    required: true
  agent:
    description: "Coding agent to run: 'opencode' (default), 'claude', or 'pi'"
    required: false
  model:
    description: Model identifier passed to the agent CLI via --model; omit for the agent's own default
    required: false
  effort:
    description: Reasoning effort passed to the agent CLI (claude --effort, opencode --variant, pi --thinking); omit for the agent's own default
    required: false
  agent-api-key:
    description: API key for the selected agent's model provider; optional (opencode's free default model needs none)
    required: false
  agent-api-key-env:
    description: >-
      Name of the environment variable agent-api-key is exported as (e.g. OPENCODE_API_KEY,
      ANTHROPIC_API_KEY, OPENAI_API_KEY, AWS_ACCESS_KEY_ID) — whatever the selected
      provider/model expects. Must end in a credential-shaped suffix (_API_KEY, _TOKEN,
      _ACCESS_KEY_ID, ...). Omit to use a default based on agent: OPENCODE_API_KEY for
      opencode, ANTHROPIC_API_KEY for claude. Required for pi whenever agent-api-key is set,
      since pi has no single default provider to fall back on.
    required: false
  max-tokens:
    description: Coding agent token budget cap
    required: false
  timeout:
    description: Wall-clock timeout in minutes
    required: false
  allowed-push-branches:
    description: >-
      Comma-separated list of branches the /push endpoint may deliver to; omit to
      disable /push entirely
    required: false
  factory-repo:
    description: >-
      Optional repo (owner/name) holding agent config/context files to copy into the
      runner's home directory. The read-token must also grant read access to this repo. Omit
      to leave the runner home untouched.
    required: false
  agent-home-path:
    description: >-
      Directory inside factory-repo whose contents are copied into the runner's home before
      the agent starts (existing files are kept). Requires factory-repo; defaults to
      .rix/agent-home.
    required: false
  output-artifact:
    description: >-
      Name to upload ./out under once the job has succeeded, for a later job to pick up with
      rix-submit's input-artifact. Omit when that step runs in this same job, where ./out is
      already there.
    required: false
  rix-version:
    description: "Rix release tag to download, or 'latest'"
    required: false
  rix-bin:
    description: "Path to an already-built rix binary to use instead of downloading a release"
    required: false

runs:
  using: composite
  steps:
    - name: Prepare rix environment
      uses: ./.github/actions/prepare-rix-env
      with:
        max-tokens: ${{ inputs.max-tokens }}
        timeout: ${{ inputs.timeout }}
        rix-version: ${{ inputs.rix-version }}
        rix-bin: ${{ inputs.rix-bin }}

    - name: Download prompt
      if: inputs.prompt-artifact != ''
      uses: actions/download-artifact@v4
      with:
        name: ${{ inputs.prompt-artifact }}
        path: prompt

    - name: Run rix agent
      env:
        AGENT_API_KEY: ${{ inputs.agent-api-key }}
        AGENT_API_KEY_ENV: ${{ inputs.agent-api-key-env }}
        RIX_AGENT: ${{ inputs.agent }}
        RIX_MODEL: ${{ inputs.model }}
        RIX_EFFORT: ${{ inputs.effort }}
        RIX_READ_TOKEN: ${{ inputs.read-token }}
        RIX_REPO: ${{ inputs.repo }}
        RIX_PROMPT: ${{ inputs.prompt }}
        RIX_PROMPT_FILE: ${{ inputs.prompt-artifact && 'prompt/prompt.md' || '' }}
        RIX_ALLOWED_PUSH_BRANCHES: ${{ inputs.allowed-push-branches }}
        RIX_FACTORY_REPO: ${{ inputs.factory-repo }}
        RIX_AGENT_HOME_PATH: ${{ inputs.agent-home-path }}
      shell: bash
      run: |
        # AGENT_API_KEY/AGENT_API_KEY_ENV are forwarded to rix as-is - it resolves which single env
        # var to export the key under (defaulting per agent, validating a caller-supplied name) and
        # adds it directly to the agent CLI subprocess's own environment (see
        # Rix.CodingAgents.AgentCredential and Rix.Agent.AgentRunner). The key never needs to exist under
        # that name in this shell or in $GITHUB_ENV.
        mkdir -p out work

        # Both prompts are forwarded as they arrived: rix reads the file itself, and reports a
        # missing one, an empty one, or both at once the same way it reports every other
        # bad flag. The file's content never passes through this shell, so nothing a failing run's
        # logs put in it can be re-parsed on the way.
        "$RIX_BIN" agent --agent "$RIX_AGENT" --output-dir out --work-dir work

    - name: Post job summary
      # rix agent writes result.json whatever its outcome - on failure too (see AgentRunner.RunAsync)
      # - so this renders the job outcome even when the step above failed and the later create-pr
      # job is skipped. The one case with no file to render is a run that could not write it, which
      # rix reports as exit code 3 rather than as its own outcome; the summary says so.
      if: always()
      uses: ./.github/actions/post-job-summary
      with:
        result-file: ${{ github.workspace }}/out/result.json
        transcript-file: ${{ github.workspace }}/out/transcript.md

    - name: Upload job output
      if: inputs.output-artifact != ''
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.output-artifact }}
        path: out/
