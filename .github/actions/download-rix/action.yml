name: Download rix
description: >-
  Downloads and checksum-verifies the rix release binary for this runner's OS/arch, exporting
  RIX_BIN. Self-contained: fetches its own copy of .github/scripts/download-rix.sh into a
  subdirectory, so it works standalone from any workflow without the caller checking anything
  out first (and without clobbering a checkout the caller already has).

inputs:
  rix-version:
    description: "Rix release tag to download, or 'latest'"
    required: false
  rix-bin:
    description: >-
      Path to an already-built rix binary to use instead of downloading a release (e.g. CI
      testing this repo's own unreleased changes). Omit to download rix-version as normal.
    required: false

runs:
  using: composite
  steps:
    - name: Get download script
      if: inputs.rix-bin == ''
      uses: actions/checkout@v4
      with:
        repository: Tim-Pohlmann/rix
        # Pin to the same release tag as the binary so a consumer pinning rix-version gets a
        # matching script; empty ref falls back to the default branch only for "latest".
        ref: ${{ inputs.rix-version != 'latest' && inputs.rix-version || '' }}
        sparse-checkout: .github/scripts/download-rix.sh
        sparse-checkout-cone-mode: false
        path: rix-src

    - name: Download rix binary
      if: inputs.rix-bin == ''
      env:
        # The API call hits the rix repo's own releases, not any target repo, so use the
        # caller's automatic token rather than a target-scoped PAT. The script exports RIX_BIN.
        GH_TOKEN: ${{ github.token }}
        VERSION: ${{ inputs.rix-version }}
      shell: bash
      run: bash rix-src/.github/scripts/download-rix.sh

    - name: Use pre-built rix binary
      if: inputs.rix-bin != ''
      shell: bash
      run: echo "RIX_BIN=${{ inputs.rix-bin }}" >> "$GITHUB_ENV"
