name: Download rix
description: >-
  Downloads and checksum-verifies the rix release binary for this runner's OS/arch, exporting
  RIX_BIN. Self-contained: runs the download script sitting beside it in this action's own
  directory, so it works standalone from any workflow without the caller checking anything out
  first.

inputs:
  rix-version:
    description: >-
      Rix release tag to download, or 'latest'. Left empty it resolves to the release this copy
      of the action belongs to, so a caller pinning a workflow ref gets that ref's own binary
      rather than whatever was published most recently — the two would otherwise drift apart
      silently the moment a newer release changed the CLI surface these actions drive. That
      default is written by .github/scripts/set-version.sh in the same commit that sets the
      csproj version, and checked against it by CI, so it can't be left behind.
    required: false
    default: ''
  rix-bin:
    description: >-
      Path to an already-built rix binary to use instead of downloading a release (e.g. CI
      testing this repo's own unreleased changes). Omit to download rix-version as normal.
    required: false

runs:
  using: composite
  steps:
    - name: Download rix binary
      if: inputs.rix-bin == ''
      env:
        # The API call hits the rix repo's own releases, not any target repo, so use the
        # caller's automatic token rather than a target-scoped PAT. The script exports RIX_BIN.
        GH_TOKEN: ${{ github.token }}
        # The one place the pinned release is written down - every caller that leaves
        # rix-version empty converges here, and an input forwarded as '' never picks up an
        # action's `default:`, so the fallback has to be in the expression rather than above.
        VERSION: ${{ inputs.rix-version || 'v0.5.0' }}
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/download-rix.sh" "$VERSION"

    - name: Use pre-built rix binary
      if: inputs.rix-bin != ''
      shell: bash
      run: echo "RIX_BIN=${{ inputs.rix-bin }}" >> "$GITHUB_ENV"
