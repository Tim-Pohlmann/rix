name: Prepare rix environment
description: >-
  Shared setup for any rix job-shaped subcommand ('job', 'ci-failure-job'): installs the coding
  agent CLI, downloads rix (exporting RIX_BIN), and normalizes max-tokens/timeout. Exports
  everything via $GITHUB_ENV so it reaches whichever later step in the calling job actually
  invokes rix. Does not touch agent-api-key at all - resolving its target env var and exporting
  it stays entirely inside each caller's own invocation step, since that's the only way to keep
  the secret out of $GITHUB_ENV.

inputs:
  max-tokens:
    description: Coding agent token budget cap
    required: false
  timeout:
    description: Wall-clock timeout in minutes
    required: false
  rix-version:
    description: "Rix release tag to download, or 'latest'"
    required: false
  rix-bin:
    description: "Path to an already-built rix binary to use instead of downloading a release"
    required: false

runs:
  using: composite
  steps:
    - name: Setup Node (rix installs the coding agent CLI via npm)
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Download rix
      uses: ./.github/actions/download-rix
      with:
        rix-version: ${{ inputs.rix-version }}
        rix-bin: ${{ inputs.rix-bin }}

    - name: Normalize token/timeout limits
      env:
        RIX_MAX_TOKENS: ${{ inputs.max-tokens }}
        RIX_TIMEOUT: ${{ inputs.timeout }}
      shell: bash
      run: |
        # A caller who omits max-tokens/timeout (the common case) has the calling workflow's
        # workflow_call inputs - type: number, no default - resolve to 0 rather than empty/null,
        # which is indistinguishable here from a caller explicitly passing 0. Treat only that one
        # ambiguous value as "unset" so rix's own default (50k tokens, 30 min) applies by simply
        # not forwarding it; forward anything else unchanged, including other invalid values
        # (negative, non-numeric), so rix's own validation reports a clear error instead of this
        # glue code silently masking a caller's mistake behind its default.
        for var in RIX_MAX_TOKENS RIX_TIMEOUT; do
          if [ -n "${!var:-}" ] && [ "${!var}" != "0" ]; then
            echo "$var=${!var}" >> "$GITHUB_ENV"
          fi
        done
