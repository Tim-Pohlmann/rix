name: Run rix ci-failure
description: >-
  Checks whether a specific workflow run actually failed and, only if it did, runs the coding
  agent against the failure, writing result.json and any git bundles to ./out.

inputs:
  repo:
    description: Target GitHub repo (owner/name) that produced the run
    required: true
  run-id:
    description: ID of the (possibly failed) workflow run to inspect
    required: true
  read-token:
    description: GitHub PAT with read access to the target repo, including Actions:read
    required: true
  agent:
    description: "Coding agent to run: 'opencode' (default), 'claude', or 'pi'"
    required: false
  model:
    description: Model identifier passed to the agent CLI via --model; omit for the agent's own default
    required: false
  agent-api-key:
    description: API key for the selected agent's model provider; optional (opencode's free default model needs none)
    required: false
  agent-api-key-env:
    description: >-
      Name of the environment variable agent-api-key is exported as (e.g. OPENCODE_API_KEY,
      ANTHROPIC_API_KEY, OPENAI_API_KEY, AWS_ACCESS_KEY_ID) — whatever the selected
      provider/model expects. Must end in a credential-shaped suffix (_API_KEY, _TOKEN,
      _ACCESS_KEY_ID, ...). Omit to use a default based on agent: OPENCODE_API_KEY for
      opencode, ANTHROPIC_API_KEY for claude. Required for pi whenever agent-api-key is set,
      since pi has no single default provider to fall back on.
    required: false
  max-rix-commits:
    description: >-
      How many of rix's own commits may already sit at the failing branch's tip before the failure
      is left alone instead of answered (default: 5). Bounds rix reacting to the CI failures of its
      own fixes forever; a commit by anyone else at the tip clears the count.
    required: false
  max-tokens:
    description: Coding agent token budget cap
    required: false
  timeout:
    description: Wall-clock timeout in minutes
    required: false
  rix-version:
    description: "Rix release tag to download, or 'latest'"
    required: false
  rix-bin:
    description: "Path to an already-built rix binary to use instead of downloading a release"
    required: false

outputs:
  has-result:
    description: >-
      'true' if the run had actually failed and the agent ran (result.json was written and is
      ready for submit-rix-job), 'false' otherwise (nothing to do, or the check/run itself
      failed).
    value: ${{ steps.run.outputs.has-result }}

runs:
  using: composite
  steps:
    - name: Prepare rix environment
      uses: ./.github/actions/prepare-rix-env
      with:
        max-tokens: ${{ inputs.max-tokens }}
        timeout: ${{ inputs.timeout }}
        rix-version: ${{ inputs.rix-version }}
        rix-bin: ${{ inputs.rix-bin }}

    - name: Run rix ci-failure
      id: run
      env:
        AGENT_API_KEY: ${{ inputs.agent-api-key }}
        AGENT_API_KEY_ENV: ${{ inputs.agent-api-key-env }}
        RIX_AGENT: ${{ inputs.agent }}
        RIX_MODEL: ${{ inputs.model }}
        RIX_READ_TOKEN: ${{ inputs.read-token }}
        RIX_REPO: ${{ inputs.repo }}
        RIX_RUN_ID: ${{ inputs.run-id }}
        RIX_MAX_RIX_COMMITS: ${{ inputs.max-rix-commits }}
      shell: bash
      run: |
        # AGENT_API_KEY/AGENT_API_KEY_ENV are forwarded to rix as-is - it resolves which single env
        # var to export the key under (defaulting per agent, validating a caller-supplied name) and
        # adds it directly to the agent CLI subprocess's own environment (see
        # Rix.Agents.AgentCredential and Rix.Job.JobRunner). The key never needs to exist under
        # that name in this shell or in $GITHUB_ENV.
        mkdir -p out work

        # Workflow commands (::error::...) read %/CR/LF as control syntax, so any of those in a
        # message straight from rix's JSON output (attacker-influenced, since it can echo failing
        # test/log content) could break the command or inject another one. Percent-encode them.
        escape_workflow_command() {
          local s=${1//'%'/'%25'}
          s=${s//$'\r'/'%0D'}
          echo "${s//$'\n'/'%0A'}"
        }

        # rix ci-failure always prints its JSON result to stdout, on every exit code (see
        # Startup.ExecuteCiFailureAsync) - capture it before deciding, rather than letting a
        # non-zero exit short-circuit under errexit before it can be read.
        set +e
        result=$("$RIX_BIN" ci-failure --agent "$RIX_AGENT" --output-dir out --work-dir work)
        exit_code=$?
        set -e

        # One jq call over the already-in-memory $result, rather than a separate subprocess per
        # field - status/conclusion/error are all read from it below.
        #
        # read splits on IFS, but a tab counts as IFS *whitespace*, so a run of tabs collapses into
        # one separator and an empty field shifts every later field left. An API error - status
        # with no conclusion - would land its message in $conclusion and leave $error blank,
        # exactly when the ::error:: annotation below is the only diagnostic there is. Translate
        # the separators to a non-whitespace one, which read keeps one for one. @tsv has already
        # escaped any tab inside a field value, so only true separators are converted.
        IFS=$'\037' read -r status conclusion error branch rix_commits \
          < <(jq -r '[.status, (.conclusion // ""), (.error // ""), (.branch // ""), (.rixCommits // "")] | @tsv' <<<"$result" | tr '\t' '\037')
        # Default to false so every branch below (including an unrecognized status) leaves
        # has-result in a defined state; only the success branch needs to override it.
        echo "has-result=false" >> "$GITHUB_OUTPUT"
        case "$status" in
          success)
            # The only case create-pr has anything to submit: the run had failed, the agent ran,
            # and result.json now exists in out/.
            echo "has-result=true" >> "$GITHUB_OUTPUT"
            ;;
          skipped)
            echo "Run $RIX_RUN_ID concluded '$conclusion', not 'failure' — skipping."
            ;;
          loopGuarded)
            # Not an error: rix has already had its turns on this branch and is standing down so a
            # human can look. Their next commit to the branch clears the streak on its own.
            echo "::notice::The last $rix_commits commits on '$branch' are rix's own — not answering this failure. Push a commit to the branch (or raise max-rix-commits) to re-enable rix on it."
            ;;
          failure | setupFailure)
            # The agent ran but the job itself failed - exit_code is already non-zero here, which
            # fails this step (and, via needs:, skips create-pr) regardless of has-result.
            ;;
          error)
            echo "::error::$(escape_workflow_command "$error")"
            ;;
          *)
            # Only reachable if rix printed a status no branch above names, which
            # tests/scripts/ci-failure-status.bats fails on - so in practice this means rix
            # printed something that isn't a result at all.
            echo "::error::$(escape_workflow_command "rix ci-failure did not produce a usable result: $result")"
            # An unrecognized status means this action and the binary disagree about the result
            # vocabulary - a version skew, since every status rix knows has an arm above. rix may
            # well have exited 0 (it succeeded on its own terms), so don't inherit that: failing
            # here is the difference between a visibly broken job and a green one that quietly
            # submitted nothing.
            exit_code=1
            ;;
        esac

        exit "$exit_code"

    - name: Post job summary
      # result.json only exists once the agent actually ran (see Startup.ExecuteCiFailureAsync)
      # - post-job-summary.sh handles a missing file gracefully, so this is safe to call
      # unconditionally, including when the run above never got past the ci-failure check.
      if: always()
      uses: ./.github/actions/post-job-summary
      with:
        result-file: ${{ github.workspace }}/out/result.json
        transcript-file: ${{ github.workspace }}/out/transcript.md
