name: Rix Job

# Reusable workflow: run `rix job` against a target repo and turn its output into PRs.
# Other repos call it with a tiny caller workflow (see README "Run via GitHub Actions").
on:
  workflow_call:
    inputs:
      repo:
        description: Target GitHub repo (owner/name)
        required: true
        type: string
      prompt:
        description: Task prompt for the coding agent
        required: true
        type: string
      agent:
        description: "Coding agent to run: 'opencode' (default) or 'claude'"
        required: false
        type: string
        default: opencode
      model:
        description: >-
          Model identifier passed to the agent CLI via --model (e.g. 'openai/gpt-4o' for
          opencode). Provider-specific; omit to use the agent's own default model (opencode
          picks a free model on its own, needing no API key).
        required: false
        type: string
      agent-api-key-env:
        description: >-
          Name of the environment variable agent-api-key is exported as (e.g. OPENCODE_API_KEY,
          ANTHROPIC_API_KEY, OPENAI_API_KEY, AWS_ACCESS_KEY_ID) — whatever the selected
          provider/model expects. Must end in a credential-shaped suffix (_API_KEY, _TOKEN,
          _ACCESS_KEY_ID, ...). Omit to use a default based on agent: OPENCODE_API_KEY for
          opencode, ANTHROPIC_API_KEY for claude.
        required: false
        type: string
      rix-version:
        description: "Rix release tag to download (default: latest)"
        required: false
        type: string
        default: latest
      max-tokens:
        description: Coding agent token budget cap
        required: false
        type: number
      timeout:
        description: Wall-clock timeout in minutes
        required: false
        type: number
      runner:
        description: runs-on label for both jobs (e.g. a self-hosted runner label)
        required: false
        type: string
        default: ubuntu-latest
    secrets:
      read-token:
        description: GitHub PAT with read access to the target repo (used to clone)
        required: true
      write-token:
        description: "GitHub PAT with contents:write + pull-requests:write on the target repo"
        required: true
      agent-api-key:
        description: >-
          API key for the selected coding agent's model provider, exported as the env var named
          by agent-api-key-env. Optional: leaving model unset lets opencode pick its own free
          default model, needing no key; set this when picking a specific provider/model.
        required: false

# Rix lives in this repo; consumers reference it as
# Tim-Pohlmann/rix/.github/workflows/job.yml@main. Adjust if the repo moves.
env:
  RIX_REPO_SLUG: Tim-Pohlmann/rix

# Both jobs only need read access via GITHUB_TOKEN (the sparse-checkout of the public rix repo).
# All writes to the target repo go through the write-token PAT, never GITHUB_TOKEN — so deny it
# write access explicitly, keeping the untrusted agent run unable to push using the caller token.
permissions:
  contents: read

jobs:
  run:
    name: Run rix job
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Setup Node (rix installs the coding agent CLI via npm)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # Sparse-checkout of the rix repo (not the target) for the cross-platform download helper,
      # which is unit-tested in CI (tests/scripts/download-rix.bats).
      - name: Get rix download helper
        uses: actions/checkout@v4
        with:
          repository: ${{ env.RIX_REPO_SLUG }}
          # Pin the helper to the same release tag as the binary so a consumer pinning
          # rix-version gets a matching script; empty ref falls back to the default branch
          # only for "latest".
          ref: ${{ inputs.rix-version != 'latest' && inputs.rix-version || '' }}
          sparse-checkout: .github/scripts/download-rix.sh
          sparse-checkout-cone-mode: false
          path: rix-src

      - name: Download rix binary
        env:
          # The API call hits RIX_REPO_SLUG, not the target repo, so use the caller's automatic
          # token rather than the target-scoped read PAT. The script exports RIX_BIN.
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.rix-version }}
        shell: bash
        run: bash rix-src/.github/scripts/download-rix.sh

      - name: Run rix job
        env:
          AGENT_API_KEY: ${{ secrets.agent-api-key }}
          AGENT_API_KEY_ENV: ${{ inputs.agent-api-key-env }}
          RIX_AGENT: ${{ inputs.agent }}
          RIX_MODEL: ${{ inputs.model }}
          RIX_READ_TOKEN: ${{ secrets.read-token }}
          RIX_REPO: ${{ inputs.repo }}
          RIX_PROMPT: ${{ inputs.prompt }}
          RIX_MAX_TOKENS: ${{ inputs.max-tokens }}
          RIX_TIMEOUT: ${{ inputs.timeout }}
        shell: bash
        run: |
          # Export the secret under whatever env var name the selected provider/model expects.
          # No key is required when model is left unset — opencode then picks its own free model.
          if [ -n "$AGENT_API_KEY" ]; then
            key_env="$AGENT_API_KEY_ENV"
            if [ -z "$key_env" ]; then
              # Caller didn't say which env var to use — default based on agent, since
              # opencode and claude expect different credentials. Normalize case/whitespace
              # the same way rix's own AgentKindParser does, so e.g. "Claude" still matches.
              agent_normalized=$(printf '%s' "$RIX_AGENT" | tr '[:upper:]' '[:lower:]' | xargs)
              case "$agent_normalized" in
                claude) key_env=ANTHROPIC_API_KEY ;;
                *) key_env=OPENCODE_API_KEY ;;
              esac
            fi
            # Restrict to credential-shaped suffixes covering opencode's supported providers
            # (ANTHROPIC_API_KEY, AWS_ACCESS_KEY_ID, GOOGLE_APPLICATION_CREDENTIALS,
            # SNOWFLAKE_CORTEX_TOKEN, ...), rather than deny-listing every internal/runtime
            # variable a caller could otherwise clobber. A couple of the allowed suffixes (e.g.
            # _TOKEN) would otherwise overlap with vars this workflow relies on, so also block
            # RIX_*/AGENT_API_KEY* (this script's own vars) and GITHUB_* (GITHUB_TOKEN etc) by
            # name.
            if [[ "$key_env" =~ ^(RIX_|AGENT_API_KEY|GITHUB_) ]] \
              || ! [[ "$key_env" =~ ^[A-Z][A-Z0-9_]*_(API_KEY|TOKEN|KEY_ID|ACCESS_KEY|CREDENTIALS|PROFILE|ACCOUNT|PROJECT|PAT|ARN|RESOURCE_NAME)$ ]]; then
              echo "::error::agent-api-key-env '$key_env' must be a credential-shaped environment variable name (e.g. *_API_KEY, *_TOKEN, *_ACCESS_KEY_ID) and not one of rix's own runtime variables" >&2
              exit 1
            fi
            export "$key_env"="$AGENT_API_KEY"
          fi
          mkdir -p out work
          "$RIX_BIN" job --agent "${RIX_AGENT:-opencode}" --output-dir out --work-dir work

      - name: Upload job output
        uses: actions/upload-artifact@v4
        with:
          name: rix-output
          path: out/

  create-pr:
    name: Create PRs
    needs: run
    runs-on: ${{ inputs.runner }}
    steps:
      # Sparse-checkout of the rix repo (not the target) for the cross-platform download helper,
      # which is unit-tested in CI (tests/scripts/download-rix.bats).
      - name: Get rix download helper
        uses: actions/checkout@v4
        with:
          repository: ${{ env.RIX_REPO_SLUG }}
          # Pin the helper to the same release tag as the binary so a consumer pinning
          # rix-version gets a matching script; empty ref falls back to the default branch
          # only for "latest".
          ref: ${{ inputs.rix-version != 'latest' && inputs.rix-version || '' }}
          sparse-checkout: .github/scripts/download-rix.sh
          sparse-checkout-cone-mode: false
          path: rix-src

      - name: Download rix binary
        env:
          # Downloads the rix release from RIX_REPO_SLUG, not the target repo, so use the
          # caller's automatic token rather than the target-scoped write PAT. The script exports
          # RIX_BIN.
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.rix-version }}
        shell: bash
        run: bash rix-src/.github/scripts/download-rix.sh

      - name: Download job output
        uses: actions/download-artifact@v4
        with:
          name: rix-output
          path: out

      - name: Push branches and open PRs
        env:
          RIX_REPO: ${{ inputs.repo }}
          RIX_WRITE_TOKEN: ${{ secrets.write-token }}
          RIX_INPUT_DIR: out
        shell: bash
        run: |
          "$RIX_BIN" submit
