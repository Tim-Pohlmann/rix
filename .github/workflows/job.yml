name: Rix Job

# Reusable workflow: run `rix job` against a target repo and turn its output into PRs.
# Other repos call it with a tiny caller workflow (see README "Run via GitHub Actions").
on:
  workflow_call:
    inputs:
      repo:
        description: Target GitHub repo (owner/name)
        required: true
        type: string
      prompt:
        description: Task prompt for the coding agent
        required: true
        type: string
      agent:
        description: "Coding agent to run: 'opencode' (default) or 'claude'"
        required: false
        type: string
        default: opencode
      model:
        description: >-
          Model identifier passed to the agent CLI via --model (e.g. 'openai/gpt-4o' for
          opencode). Provider-specific; omit to use the agent's own default model (opencode
          picks a free model on its own, needing no API key).
        required: false
        type: string
      agent-api-key-env:
        description: >-
          Name of the environment variable agent-api-key is exported as (e.g. OPENCODE_API_KEY,
          ANTHROPIC_API_KEY, OPENAI_API_KEY) — whatever the selected provider/model expects.
          Must end in _API_KEY. Omit to use a default based on agent: OPENCODE_API_KEY for
          opencode, ANTHROPIC_API_KEY for claude.
        required: false
        type: string
      rix-version:
        description: "Rix release tag to download (default: latest)"
        required: false
        type: string
        default: latest
      max-tokens:
        description: Coding agent token budget cap
        required: false
        type: number
      timeout:
        description: Wall-clock timeout in minutes
        required: false
        type: number
      runner:
        description: runs-on label for both jobs (e.g. a self-hosted runner label)
        required: false
        type: string
        default: ubuntu-latest
    secrets:
      read-token:
        description: GitHub PAT with read access to the target repo (used to clone)
        required: true
      write-token:
        description: "GitHub PAT with contents:write + pull-requests:write on the target repo"
        required: true
      agent-api-key:
        description: >-
          API key for the selected coding agent's model provider, exported as the env var named
          by agent-api-key-env. Optional: leaving model unset lets opencode pick its own free
          default model, needing no key; set this when picking a specific provider/model.
        required: false

# Rix lives in this repo; consumers reference it as
# Tim-Pohlmann/rix/.github/workflows/job.yml@main. Adjust if the repo moves.
env:
  RIX_REPO_SLUG: Tim-Pohlmann/rix

# Both jobs only need read access via GITHUB_TOKEN (the sparse-checkout of the public rix repo).
# All writes to the target repo go through the write-token PAT, never GITHUB_TOKEN — so deny it
# write access explicitly, keeping the untrusted agent run unable to push using the caller token.
permissions:
  contents: read

jobs:
  run:
    name: Run rix job
    runs-on: ${{ inputs.runner }}
    steps:
      # Sparse-checkout of the rix repo (not the target). Composite actions referenced below via
      # a relative `uses: ./...` resolve against this repo/ref regardless of this checkout, but
      # their `run:` steps (e.g. download-rix.sh) need the file physically present in the
      # workspace, which this provides.
      - name: Get rix repo (for local composite actions)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.RIX_REPO_SLUG }}
          # Pin to the same release tag as the binary so a consumer pinning rix-version gets a
          # matching script; empty ref falls back to the default branch only for "latest".
          ref: ${{ inputs.rix-version != 'latest' && inputs.rix-version || '' }}
          sparse-checkout: .github/scripts/download-rix.sh
          sparse-checkout-cone-mode: false

      - name: Run rix job
        uses: ./.github/actions/run-rix-job
        with:
          repo: ${{ inputs.repo }}
          prompt: ${{ inputs.prompt }}
          read-token: ${{ secrets.read-token }}
          agent: ${{ inputs.agent }}
          model: ${{ inputs.model }}
          agent-api-key: ${{ secrets.agent-api-key }}
          agent-api-key-env: ${{ inputs.agent-api-key-env }}
          max-tokens: ${{ inputs.max-tokens }}
          timeout: ${{ inputs.timeout }}
          rix-version: ${{ inputs.rix-version }}

      - name: Upload job output
        uses: actions/upload-artifact@v4
        with:
          name: rix-output
          path: out/

  create-pr:
    name: Create PRs
    needs: run
    runs-on: ${{ inputs.runner }}
    steps:
      # Sparse-checkout of the rix repo (not the target); see the comment in the `run` job above.
      - name: Get rix repo (for local composite actions)
        uses: actions/checkout@v4
        with:
          repository: ${{ env.RIX_REPO_SLUG }}
          ref: ${{ inputs.rix-version != 'latest' && inputs.rix-version || '' }}
          sparse-checkout: .github/scripts/download-rix.sh
          sparse-checkout-cone-mode: false

      - name: Download job output
        uses: actions/download-artifact@v4
        with:
          name: rix-output
          path: out

      - name: Submit rix job
        uses: ./.github/actions/submit-rix-job
        with:
          repo: ${{ inputs.repo }}
          write-token: ${{ secrets.write-token }}
          input-dir: out
          rix-version: ${{ inputs.rix-version }}
