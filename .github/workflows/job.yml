name: Rix Job

# Reusable workflow: run `rix job` against a target repo and turn its output into PRs.
# Other repos call it with a tiny caller workflow (see README "Run via GitHub Actions").
on:
  workflow_call:
    inputs:
      repo:
        description: Target GitHub repo (owner/name)
        required: true
        type: string
      prompt:
        description: Task prompt for the coding agent
        required: true
        type: string
      agent:
        description: "Coding agent to run: 'claude' (default) or 'opencode'"
        required: false
        type: string
        default: claude
      rix-version:
        description: Rix release tag to download (default: latest)
        required: false
        type: string
        default: latest
      max-tokens:
        description: Coding agent token budget cap
        required: false
        type: number
      timeout:
        description: Wall-clock timeout in minutes
        required: false
        type: number
      runner:
        description: runs-on label for both jobs (e.g. a self-hosted runner label)
        required: false
        type: string
        default: ubuntu-latest
    secrets:
      read-token:
        description: GitHub PAT with read access to the target repo (used to clone)
        required: true
      write-token:
        description: GitHub PAT with contents:write + pull-requests:write on the target repo
        required: true
      agent-api-key:
        description: >-
          API key for the selected coding agent's model provider. Mapped to the provider
          environment variable the agent reads (ANTHROPIC_API_KEY for 'claude' and 'opencode').
        required: true

# Rix lives in this repo; consumers reference it as
# Tim-Pohlmann/rix/.github/workflows/job.yml@main. Adjust if the repo moves.
env:
  RIX_REPO_SLUG: Tim-Pohlmann/rix

jobs:
  run:
    name: Run rix job
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Setup Node (rix installs the coding agent CLI via npm)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download rix binary
        env:
          # Downloads the rix release from RIX_REPO_SLUG, not the target repo, so use the
          # caller's automatic token rather than the target-scoped read PAT.
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.rix-version }}
        shell: bash
        run: |
          # Detect the runner's OS/arch and resolve the matching rix release asset via the REST
          # API (curl + grep only, no gh/jq) so the workflow runs on minimal runners of any
          # platform. The asset download itself is unauthenticated: rix releases are public, and
          # forwarding the API auth header through GitHub's redirect to S3 would be rejected.
          # `tar -xf` extracts both .tar.gz (GNU tar) and .zip (bsdtar on Windows), so there is
          # no unzip dependency.
          case "$(uname -s)" in
            Linux)  os=linux ;;
            Darwin) os=osx ;;
            MINGW*|MSYS*|CYGWIN*) os=win ;;
            *) echo "Unsupported OS: $(uname -s)" >&2; exit 1 ;;
          esac
          case "$(uname -m)" in
            x86_64|amd64)  cpu=x64 ;;
            arm64|aarch64) cpu=arm64 ;;
            *) echo "Unsupported architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          rid="$os-$cpu"
          [[ "$os" == "win" ]] && ext="zip" || ext="tar.gz"
          if [[ "${VERSION:-latest}" == "latest" ]]; then
            api="https://api.github.com/repos/$RIX_REPO_SLUG/releases/latest"
          else
            api="https://api.github.com/repos/$RIX_REPO_SLUG/releases/tags/$VERSION"
          fi
          asset_url=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$api" \
            | grep -o "https://[^\"]*rix-[^\"]*-$rid\.$ext" | head -n1)
          if [[ -z "$asset_url" ]]; then
            echo "No rix-*-$rid.$ext asset in release '${VERSION:-latest}' of $RIX_REPO_SLUG" >&2
            exit 1
          fi
          curl -fSL -o "rix-archive.$ext" "$asset_url"
          mkdir -p rix-bin
          tar -xf "rix-archive.$ext" -C rix-bin
          chmod +x rix-bin/rix 2>/dev/null || true

      - name: Run rix job
        env:
          AGENT_API_KEY: ${{ secrets.agent-api-key }}
          RIX_AGENT: ${{ inputs.agent }}
          RIX_READ_TOKEN: ${{ secrets.read-token }}
          RIX_REPO: ${{ inputs.repo }}
          RIX_PROMPT: ${{ inputs.prompt }}
          RIX_MAX_TOKENS: ${{ inputs.max-tokens }}
          RIX_TIMEOUT: ${{ inputs.timeout }}
        shell: bash
        run: |
          # Map the generic agent API key onto the provider env var the selected agent reads.
          case "${RIX_AGENT:-claude}" in
            claude|opencode) export ANTHROPIC_API_KEY="$AGENT_API_KEY" ;;
            *) echo "Unknown agent: $RIX_AGENT" >&2; exit 1 ;;
          esac
          mkdir -p out work
          ./rix-bin/rix job --agent "${RIX_AGENT:-claude}" --output-dir out --work-dir work

      - name: Upload job output
        uses: actions/upload-artifact@v4
        with:
          name: rix-output
          path: out/

  create-pr:
    name: Create PRs
    needs: run
    runs-on: ${{ inputs.runner }}
    steps:
      - name: Download rix binary
        env:
          # Downloads the rix release from RIX_REPO_SLUG, not the target repo, so use the
          # caller's automatic token rather than the target-scoped write PAT.
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.rix-version }}
        shell: bash
        run: |
          # Detect the runner's OS/arch and resolve the matching rix release asset via the REST
          # API (curl + grep only, no gh/jq) so the workflow runs on minimal runners of any
          # platform. The asset download itself is unauthenticated: rix releases are public, and
          # forwarding the API auth header through GitHub's redirect to S3 would be rejected.
          # `tar -xf` extracts both .tar.gz (GNU tar) and .zip (bsdtar on Windows), so there is
          # no unzip dependency.
          case "$(uname -s)" in
            Linux)  os=linux ;;
            Darwin) os=osx ;;
            MINGW*|MSYS*|CYGWIN*) os=win ;;
            *) echo "Unsupported OS: $(uname -s)" >&2; exit 1 ;;
          esac
          case "$(uname -m)" in
            x86_64|amd64)  cpu=x64 ;;
            arm64|aarch64) cpu=arm64 ;;
            *) echo "Unsupported architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          rid="$os-$cpu"
          [[ "$os" == "win" ]] && ext="zip" || ext="tar.gz"
          if [[ "${VERSION:-latest}" == "latest" ]]; then
            api="https://api.github.com/repos/$RIX_REPO_SLUG/releases/latest"
          else
            api="https://api.github.com/repos/$RIX_REPO_SLUG/releases/tags/$VERSION"
          fi
          asset_url=$(curl -fsSL \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "$api" \
            | grep -o "https://[^\"]*rix-[^\"]*-$rid\.$ext" | head -n1)
          if [[ -z "$asset_url" ]]; then
            echo "No rix-*-$rid.$ext asset in release '${VERSION:-latest}' of $RIX_REPO_SLUG" >&2
            exit 1
          fi
          curl -fSL -o "rix-archive.$ext" "$asset_url"
          mkdir -p rix-bin
          tar -xf "rix-archive.$ext" -C rix-bin
          chmod +x rix-bin/rix 2>/dev/null || true

      - name: Download job output
        uses: actions/download-artifact@v4
        with:
          name: rix-output
          path: out

      - name: Push branches and open PRs
        env:
          RIX_REPO: ${{ inputs.repo }}
          RIX_WRITE_TOKEN: ${{ secrets.write-token }}
          RIX_INPUT_DIR: out
        shell: bash
        run: ./rix-bin/rix submit
