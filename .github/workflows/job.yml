name: Rix Job

# Reusable workflow: run `rix job` against a target repo and turn its output into PRs.
# Other repos call it with a tiny caller workflow (see README "Run via GitHub Actions").
on:
  workflow_call:
    inputs:
      repo:
        description: Target GitHub repo (owner/name)
        required: true
        type: string
      prompt:
        description: Task prompt for the coding agent
        required: true
        type: string
      agent:
        description: "Coding agent to run: 'opencode' (default), 'claude', or 'pi'"
        required: false
        type: string
      model:
        description: >-
          Model identifier passed to the agent CLI via --model (e.g. 'openai/gpt-4o' for
          opencode). Provider-specific; omit to use the agent's own default model (opencode
          picks a free model on its own, needing no API key).
        required: false
        type: string
      agent-api-key-env:
        description: >-
          Name of the environment variable agent-api-key is exported as (e.g. OPENCODE_API_KEY,
          ANTHROPIC_API_KEY, OPENAI_API_KEY, AWS_ACCESS_KEY_ID) — whatever the selected
          provider/model expects. Must end in a credential-shaped suffix (_API_KEY, _TOKEN,
          _ACCESS_KEY_ID, ...). Omit to use a default based on agent: OPENCODE_API_KEY for
          opencode, ANTHROPIC_API_KEY for claude. Required for pi whenever agent-api-key is set,
          since pi has no single default provider to fall back on.
        required: false
        type: string
      rix-version:
        description: "Rix release tag to download, or 'latest'"
        required: false
        type: string
      max-tokens:
        description: Coding agent token budget cap
        required: false
        type: number
      timeout:
        description: Wall-clock timeout in minutes
        required: false
        type: number
      allowed-push-branches:
        description: >-
          Comma-separated list of rix/* branches the /push endpoint may deliver to
          (e.g. 'rix/resume-a,rix/resume-b'). /push rejects every branch until this is set;
          omit it to disable /push entirely.
        required: false
        type: string
      runner:
        description: runs-on label for both jobs (e.g. a self-hosted runner label)
        required: false
        type: string
        default: ubuntu-latest
    secrets:
      read-token:
        description: GitHub PAT with read access to the target repo (used to clone)
        required: true
      write-token:
        description: "GitHub PAT with contents:write + pull-requests:write on the target repo"
        required: true
      agent-api-key:
        description: >-
          API key for the selected coding agent's model provider, exported as the env var named
          by agent-api-key-env. Optional: leaving model unset lets opencode pick its own free
          default model, needing no key; set this when picking a specific provider/model.
        required: false

# Both jobs only need read access via GITHUB_TOKEN (the sparse-checkout of the public rix repo).
# All writes to the target repo go through the write-token PAT, never GITHUB_TOKEN — so deny it
# write access explicitly, keeping the untrusted agent run unable to push using the caller token.
permissions:
  contents: read

jobs:
  run:
    name: Run rix job
    runs-on: ${{ inputs.runner }}
    steps:
      # A local `uses: ./...` action reference resolves against whatever is already checked out
      # at github.workspace - there's no such thing as it resolving against "the reusable
      # workflow's own repo" automatically, so this checkout is required before the composite
      # action step below (and its own nested `uses: ./.github/actions/download-rix`) can
      # resolve. .github/scripts/download-rix.sh itself isn't needed here - download-rix fetches
      # its own copy.
      #
      # Pinned to job.workflow_sha - the exact commit of *this* job.yml file that's actually
      # running - rather than rix-version. rix-version only selects which release binary to
      # download; it's a separate, caller-controlled input that can point at a tag cut before
      # this composite-action refactor existed, which would leave these actions missing here.
      - name: Get rix repo (for local composite actions)
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false

      - name: Run rix job
        uses: ./.github/actions/run-rix-job
        with:
          repo: ${{ inputs.repo }}
          prompt: ${{ inputs.prompt }}
          read-token: ${{ secrets.read-token }}
          agent: ${{ inputs.agent }}
          model: ${{ inputs.model }}
          agent-api-key: ${{ secrets.agent-api-key }}
          agent-api-key-env: ${{ inputs.agent-api-key-env }}
          max-tokens: ${{ inputs.max-tokens }}
          timeout: ${{ inputs.timeout }}
          allowed-push-branches: ${{ inputs.allowed-push-branches }}
          rix-version: ${{ inputs.rix-version }}

      - name: Upload job output
        uses: actions/upload-artifact@v4
        with:
          name: rix-output
          path: out/

  create-pr:
    name: Create PRs
    needs: run
    runs-on: ${{ inputs.runner }}
    steps:
      # See the comment on the equivalent step in the `run` job above.
      - name: Get rix repo (for local composite actions)
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false

      - name: Download job output
        uses: actions/download-artifact@v4
        with:
          name: rix-output
          path: out

      - name: Submit rix job
        uses: ./.github/actions/submit-rix-job
        with:
          repo: ${{ inputs.repo }}
          write-token: ${{ secrets.write-token }}
          input-dir: out
          rix-version: ${{ inputs.rix-version }}
