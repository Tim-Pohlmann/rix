name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dolphin:
    name: Dolphin Check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Dolphin check
        uses: Tim-Pohlmann/Dolphin@v1
        with:
          fail-on: info

  scripts:
    name: Lint & test workflow scripts
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Lint workflows (actionlint)
        uses: raven-actions/actionlint@205b530c5d9fa8f44ae9ed59f341a0db994aa6f8 # v2
        with:
          # actionlint (as of v1.7.12) doesn't yet know about the job.workflow_repository /
          # job.workflow_sha context properties, even though they're documented and supported by
          # the runner - see https://github.com/rhysd/actionlint/issues/260 for the same gap on an
          # earlier context property. Narrowly ignore just these false positives.
          #
          # No literal spaces/quotes in the pattern (using \s and . instead) - raven-actions/
          # actionlint's flag tokenizer only understands double-quote grouping with no escaping,
          # so a quoted pattern containing literal double quotes gets mis-split into several
          # bogus positional args instead of a single -ignore value.
          flags: '-ignore property\s.workflow_(repository|sha).\sis\snot\sdefined\sin\sobject\stype\s\{check_run_id:'

      - name: Lint shell scripts (shellcheck)
        run: shellcheck .github/scripts/*.sh

      - name: Run bats tests
        run: |
          sudo apt-get update
          sudo apt-get install -y bats
          bats tests/scripts

  build-rix:
    name: Build rix (for agent-plumbing tests)
    runs-on: ubuntu-latest

    # Built from source rather than downloaded from the latest release, so agent-plumbing below
    # exercises this PR's own rix changes (e.g. BuildInvocation, error handling) instead of
    # whatever was last published - a release can lag behind an open PR by any number of fixes.
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Publish rix
        run: dotnet publish src/Rix/Rix.csproj -r linux-x64 -c Release -o rix-bin

      - name: Upload rix binary
        uses: actions/upload-artifact@v4
        with:
          name: rix-bin
          path: rix-bin/rix
          # A self-contained single-file executable is already compressed dotnet-side and only
          # needed for this run's own lifetime, not the repo's default long retention.
          compression-level: 0
          retention-days: 1

  agent-plumbing:
    name: "Agent plumbing: ${{ matrix.name }}"
    runs-on: ubuntu-latest
    needs: build-rix
    permissions:
      contents: read
    env:
      RIX_BIN_PATH: ${{ github.workspace }}/rix-bin/rix

    # Runs the real .github/actions/run-rix-job composite action (the same one job.yml's `run`
    # job uses) against this repo itself, with no agent API key, across several (agent, model)
    # configurations, using the binary build-rix just published from this PR's own source. This
    # exercises the actual end-to-end plumbing - CLI parsing, agent CLI install, BuildInvocation,
    # the real agent process - rather than a hand-copied mirror of it, so a real regression (e.g.
    # an agent CLI needing a new required flag) fails CI here instead of only being discovered by
    # a broken production run.
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: opencode free default model succeeds with no key
            agent: opencode
            model: ''
            expect: success
          # opencode falls back to its own free default model when it has no usable credential
          # for the requested provider, rather than erroring - so an *absent* key never exercises
          # a real auth failure. An invalid key forces opencode to actually call out to the
          # provider and fail there, matching a real expired/typo'd-credential failure.
          - name: opencode explicit paid model fails with an invalid key
            agent: opencode
            model: openai/gpt-4o
            agent-api-key-env: OPENAI_API_KEY
            agent-api-key: sk-invalid-0000000000000000000000000000000000000000
            expect: failure
            expect-diagnostic: "Incorrect API key"
          - name: claude fails without a key
            agent: claude
            model: ''
            expect: failure
            expect-diagnostic: "Not logged in"
          - name: claude explicit model fails without a key
            agent: claude
            model: claude-opus-4-1
            expect: failure
            expect-diagnostic: "Not logged in"

    steps:
      # Only the composite actions under .github/actions are needed here (the app source and
      # test suites aren't touched directly by this job - build-rix above already built the
      # binary under test).
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false

      - name: Download rix binary
        uses: actions/download-artifact@v4
        with:
          name: rix-bin
          path: rix-bin

      - name: Make rix binary executable
        run: chmod +x rix-bin/rix

      - name: Run rix job
        id: run
        continue-on-error: true
        uses: ./.github/actions/run-rix-job
        with:
          repo: ${{ github.repository }}
          prompt: >-
            Make no changes to any files and do not call the PR endpoint.
            Just reply with the text: OK
          read-token: ${{ github.token }}
          agent: ${{ matrix.agent }}
          model: ${{ matrix.model }}
          agent-api-key: ${{ matrix.agent-api-key }}
          agent-api-key-env: ${{ matrix.agent-api-key-env }}
          rix-bin: ${{ env.RIX_BIN_PATH }}

      - name: Assert expected outcome
        # status/error come from the agent process's own output (via steps.run.outputs), so they
        # must be passed through env rather than interpolated directly into the script - inline
        # ${{ }} substitution happens before bash parses the script, so a message containing
        # spaces/quotes/backticks would otherwise be interpreted as extra shell code.
        env:
          STATUS: ${{ steps.run.outputs.status }}
          ERROR: ${{ steps.run.outputs.error }}
          EXPECT_DIAGNOSTIC: ${{ matrix.expect-diagnostic }}
        run: |
          status="$STATUS"
          error="$ERROR"
          echo "rix job status: $status"
          echo "rix job error: $error"
          if [ "${{ matrix.expect }}" = "success" ]; then
            [ "$status" = "success" ] || { echo "expected success, got '$status' ($error)"; exit 1; }
          else
            # status alone isn't precise enough: "failure" also covers unrelated bugs like a
            # git-bundle-delivery error, and "setupFailure" covers e.g. a broken agent-CLI
            # install - neither is the auth-shaped failure these matrix legs expect. Pin down
            # that the agent process itself ran and exited non-zero (not a setup failure, not a
            # hang, not a later delivery-stage failure), so an unrelated regression can't
            # masquerade as "expected failure".
            [ "$status" = "failure" ] || { echo "expected status 'failure', got '$status' ($error)"; exit 1; }
            [[ "$error" == "agent failed: exited with code "* ]] || { echo "expected an agent-exit failure, got: $error"; exit 1; }
            # Beyond the exit-stage check above, pin the failure to its expected *reason* (e.g.
            # auth vs. a bad flag) using the diagnostic text captured from the agent's own
            # stderr/stdout - otherwise any same-exit-code failure would satisfy this leg.
            if [ -n "$EXPECT_DIAGNOSTIC" ] && [[ "$error" != *"$EXPECT_DIAGNOSTIC"* ]]; then
              echo "expected diagnostic containing '$EXPECT_DIAGNOSTIC', got: $error"
              exit 1
            fi
          fi

      # Only for the success config: also runs the real submit composite action (the same one
      # job.yml's create-pr job uses), proving end to end that a garbage write-token is safe here
      # - SubmitRunner never touches it because the prompt above guarantees zero PRs were queued.
      - name: Submit (garbage write-token; safe because zero PRs were requested)
        if: matrix.expect == 'success'
        uses: ./.github/actions/submit-rix-job
        with:
          repo: ${{ github.repository }}
          write-token: not-a-real-token
          input-dir: out
          rix-bin: ${{ env.RIX_BIN_PATH }}

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build
        run: dotnet build Rix.slnx -c Release

      - name: Test
        run: dotnet test Rix.slnx --no-build -c Release --verbosity normal

  analyze:
    name: Analyze
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Install dotnet-sonarscanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Begin SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner begin \
            /k:"Tim-Pohlmann_rix" \
            /o:"tim-pohlmann" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.cs.opencover.reportsPaths="tests/**/coverage.opencover.xml"

      - name: Build
        run: dotnet build Rix.slnx -c Release

      - name: Test
        run: dotnet test Rix.slnx --no-build -c Release --verbosity normal --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: End SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

