name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dolphin:
    name: Dolphin Check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Dolphin check
        uses: Tim-Pohlmann/Dolphin@v1
        with:
          fail-on: info

  scripts:
    name: Lint & test workflow scripts
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Lint workflows (actionlint)
        uses: raven-actions/actionlint@205b530c5d9fa8f44ae9ed59f341a0db994aa6f8 # v2
        with:
          # actionlint (as of v1.7.12) doesn't yet know about the job.workflow_repository /
          # job.workflow_sha context properties, even though they're documented and supported by
          # the runner - see https://github.com/rhysd/actionlint/issues/260 for the same gap on an
          # earlier context property. Narrowly ignore just these false positives.
          flags: >-
            -ignore 'property "workflow_(repository|sha)" is not defined in object type
            \{check_run_id:'

      - name: Lint shell scripts (shellcheck)
        run: shellcheck .github/scripts/*.sh

      - name: Run bats tests
        run: |
          sudo apt-get update
          sudo apt-get install -y bats
          bats tests/scripts

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build
        run: dotnet build Rix.slnx -c Release

      - name: Test
        run: dotnet test Rix.slnx --no-build -c Release --verbosity normal

  analyze:
    name: Analyze
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Install dotnet-sonarscanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Begin SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner begin \
            /k:"Tim-Pohlmann_rix" \
            /o:"tim-pohlmann" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.cs.opencover.reportsPaths="tests/**/coverage.opencover.xml"

      - name: Build
        run: dotnet build Rix.slnx -c Release

      - name: Test
        run: dotnet test Rix.slnx --no-build -c Release --verbosity normal --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: End SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

