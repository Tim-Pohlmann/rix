name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dolphin:
    name: Dolphin Check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Dolphin check
        uses: Tim-Pohlmann/Dolphin@v1
        with:
          fail-on: info

  scripts:
    name: Lint & test workflow scripts
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Lint workflows (actionlint)
        uses: raven-actions/actionlint@205b530c5d9fa8f44ae9ed59f341a0db994aa6f8 # v2

      - name: Lint shell scripts (shellcheck)
        run: shellcheck .github/scripts/*.sh

      - name: Run bats tests
        run: |
          sudo apt-get update
          sudo apt-get install -y bats
          bats tests/scripts/download-rix.bats

  agent-plumbing:
    name: Agent CLI plumbing (live)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node (installs opencode/claude the same way rix does)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install agent CLIs
        run: npm install -g opencode-ai @anthropic-ai/claude-code

      - name: Install bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Run live agent CLI plumbing tests
        run: bats tests/scripts/agent-plumbing.bats

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build
        run: dotnet build Rix.slnx -c Release

      - name: Test
        run: dotnet test Rix.slnx --no-build -c Release --verbosity normal

  analyze:
    name: Analyze
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Install dotnet-sonarscanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Begin SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner begin \
            /k:"Tim-Pohlmann_rix" \
            /o:"tim-pohlmann" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.cs.opencover.reportsPaths="tests/**/coverage.opencover.xml" \
            /d:sonar.issue.ignore.multicriteria="npmScripts,npmVersionPin" \
            /d:sonar.issue.ignore.multicriteria.npmScripts.ruleKey="githubactions:S6505" \
            /d:sonar.issue.ignore.multicriteria.npmScripts.resourceKey=".github/workflows/ci.yml" \
            /d:sonar.issue.ignore.multicriteria.npmVersionPin.ruleKey="githubactions:S8543" \
            /d:sonar.issue.ignore.multicriteria.npmVersionPin.resourceKey=".github/workflows/ci.yml"
          # The agent-plumbing job's `npm install -g opencode-ai @anthropic-ai/claude-code` trips
          # two rules that don't fit its purpose: S6505 (--ignore-scripts) would break opencode-ai's
          # postinstall step, which symlinks its real binary; S8543 (pin versions) would defeat the
          # job's entire point of testing against whatever's currently latest to catch CLI drift.

      - name: Build
        run: dotnet build Rix.slnx -c Release

      - name: Test
        run: dotnet test Rix.slnx --no-build -c Release --verbosity normal --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: End SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

