name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  dolphin:
    name: Dolphin Check
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Dolphin check
        uses: Tim-Pohlmann/Dolphin@v1
        with:
          fail-on: info

  scripts:
    name: Lint & test workflow scripts
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Lint workflows (actionlint)
        uses: raven-actions/actionlint@205b530c5d9fa8f44ae9ed59f341a0db994aa6f8 # v2
        with:
          # actionlint (as of v1.7.12) doesn't yet know about the job.workflow_repository /
          # job.workflow_sha context properties, even though they're documented and supported by
          # the runner - see https://github.com/rhysd/actionlint/issues/260 for the same gap on an
          # earlier context property. Narrowly ignore just these false positives.
          #
          # No literal spaces/quotes in the pattern (using \s and . instead) - raven-actions/
          # actionlint's flag tokenizer only understands double-quote grouping with no escaping,
          # so a quoted pattern containing literal double quotes gets mis-split into several
          # bogus positional args instead of a single -ignore value.
          flags: '-ignore property\s.workflow_(repository|sha).\sis\snot\sdefined\sin\sobject\stype\s\{check_run_id:'

      - name: Lint shell scripts (shellcheck)
        run: shellcheck .github/scripts/*.sh .github/actions/*/*.sh

      - name: Run bats tests
        run: |
          sudo apt-get update
          sudo apt-get install -y bats
          bats tests/scripts

      - name: Check the workflow binary pin matches the version
        # The release is cut from whatever commit main is at, so that commit's workflows must name
        # that same release's binary. set-version.sh writes both, so this only fails when the two
        # are edited apart by hand - which fails quietly at runtime (an older CLI surface that
        # still parses these actions' arguments) rather than loudly, hence a check here.
        run: |
          csproj="v$(grep -oPm1 '(?<=<Version>)[^<]+' src/Rix/Rix.csproj)"
          pin="$(grep -oPm1 "(?<=inputs\.rix-version \|\| ')[^']+" .github/actions/download-rix/action.yml)"
          if [[ "$csproj" != "$pin" ]]; then
            echo "download-rix rix-version default ($pin) does not match src/Rix/Rix.csproj ($csproj)" >&2
            exit 1
          fi

  build-rix:
    name: Build rix (for agent-plumbing tests)
    runs-on: ubuntu-latest

    # Built from source rather than downloaded from the latest release, so agent-plumbing below
    # exercises this PR's own rix changes (e.g. BuildInvocation, error handling) instead of
    # whatever was last published - a release can lag behind an open PR by any number of fixes.
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Publish rix
        run: dotnet publish src/Rix/Rix.csproj -r linux-x64 -c Release -o rix-bin

      - name: Upload rix binary
        uses: actions/upload-artifact@v4
        with:
          name: rix-bin
          path: rix-bin/rix
          # A self-contained single-file executable is already compressed dotnet-side and only
          # needed for this run's own lifetime, not the repo's default long retention.
          compression-level: 0
          retention-days: 1

  agent-plumbing:
    name: Agent plumbing
    runs-on: ubuntu-latest
    needs: build-rix
    permissions:
      contents: read
    env:
      RIX_BIN_PATH: ${{ github.workspace }}/rix-bin/rix

    # Runs the real .github/actions/run-rix-job composite action (the same one job.yml's `run`
    # job uses) against this repo itself with opencode's free default model (no API key needed),
    # using the binary build-rix just published from this PR's own source. This exercises the
    # actual end-to-end plumbing - CLI parsing, agent CLI install, BuildInvocation, the real agent
    # process - rather than a hand-copied mirror of it, so a real regression (e.g. an agent CLI
    # needing a new required flag) fails CI here instead of only being discovered by a broken
    # production run. Failure-mode assertions (auth errors, bad models, ...) live in the
    # `rix-job-e2e` bats test instead, where they can do real JSON parsing without embedding that
    # logic in workflow YAML.
    steps:
      # Only the composite actions under .github/actions are needed here (the app source and
      # test suites aren't touched directly by this job - build-rix above already built the
      # binary under test).
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false

      - name: Download rix binary
        uses: actions/download-artifact@v4
        with:
          name: rix-bin
          path: rix-bin

      - name: Make rix binary executable
        run: chmod +x rix-bin/rix

      - name: Run rix job
        uses: ./.github/actions/run-rix-job
        with:
          repo: ${{ github.repository }}
          prompt: >-
            Make no changes to any files and do not call the PR endpoint.
            Just reply with the text: OK
          read-token: ${{ github.token }}
          agent: opencode
          # max-tokens/timeout are deliberately 0, not omitted: job.yml declares them as
          # workflow_call inputs of type: number with no default, so a caller who omits them
          # (the common case) makes GitHub Actions resolve the expressions to 0 rather than
          # empty/null and pass that 0 through to this action. run-rix-job must treat that 0 as
          # "unset" and let rix's own defaults (50k tokens, 30 min) apply instead of forwarding
          # it - rix rejects an explicit 0, so a regression that forwards it fails this job with
          # "--max-tokens must be a positive integer". (Omitting the inputs entirely would only
          # exercise the empty-string path, which never hits that validation.)
          max-tokens: 0
          timeout: 0
          rix-bin: ${{ env.RIX_BIN_PATH }}

      # Runs the real submit composite action (the same one job.yml's create-pr job uses), proving
      # end to end that a garbage write-token is safe here - SubmitRunner never touches it because
      # the prompt above guarantees zero PRs were queued.
      - name: Submit (garbage write-token; safe because zero PRs were requested)
        uses: ./.github/actions/submit-rix-job
        with:
          repo: ${{ github.repository }}
          write-token: not-a-real-token
          input-dir: out
          rix-bin: ${{ env.RIX_BIN_PATH }}

  ci-failure-plumbing:
    name: CI-failure plumbing
    runs-on: ubuntu-latest
    needs: build-rix
    permissions:
      contents: read
      # detect-ci-failure reads the workflow run's metadata through the Actions API, which
      # contents:read does not cover.
      actions: read
    env:
      RIX_BIN_PATH: ${{ github.workspace }}/rix-bin/rix

    # agent-plumbing's counterpart for the other composite action: runs the real
    # .github/actions/detect-ci-failure (the one on-ci-failure.yml's `detect` job drives) against
    # this very run, using the binary build-rix published from this PR's own source. This run has
    # not concluded while it is checking itself, so rix answers `skipped` - which is the point.
    # What is covered here is the layer the detect job is: the inputs every caller leaves alone,
    # resolved and forwarded for real. No agent is involved either way now, so this exercises the
    # whole action rather than the part in front of one. Nothing else in CI calls it, which is how
    # a max-rix-commits default that failed 100% of unconfigured runs got as far as review.
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false

      - name: Download rix binary
        uses: actions/download-artifact@v4
        with:
          name: rix-bin
          path: rix-bin

      - name: Make rix binary executable
        run: chmod +x rix-bin/rix

      - name: Run rix ci-failure against this in-progress run
        id: detect
        uses: ./.github/actions/detect-ci-failure
        with:
          repo: ${{ github.repository }}
          run-id: ${{ github.run_id }}
          read-token: ${{ github.token }}
          # 0 rather than omitted, for the reason spelled out on agent-plumbing's max-tokens above:
          # 0 is what on-ci-failure.yml's workflow_call input resolves to for a caller who leaves it
          # alone, and rix rejects an explicit 0. A regression that forwards it therefore fails here
          # - "--max-rix-commits must be between 1 and 100, got '0'" - instead of in every
          # unconfigured production run. Omitting it would only exercise the empty-string path,
          # which never reaches that validation.
          max-rix-commits: 0
          rix-bin: ${{ env.RIX_BIN_PATH }}

      - name: Assert the unfinished run was skipped, not answered
        env:
          SHOULD_RUN: ${{ steps.detect.outputs.should-run }}
          BRANCH: ${{ steps.detect.outputs.branch }}
        run: |
          # The step above already fails on a rejected input or an API error, so this only pins
          # down the decision: a run with no conclusion yet is not a failure to answer, and a
          # should-run of true would send a later job to start an agent against one.
          [[ "$SHOULD_RUN" == "false" ]] || { echo "expected should-run=false, got '$SHOULD_RUN'" >&2; exit 1; }
          # And that the branch output stays empty with it. It is the one value a privileged job
          # trusts, so it must never carry a name when nothing is meant to be pushed at all.
          [[ -z "$BRANCH" ]] || { echo "expected an empty branch, got '$BRANCH'" >&2; exit 1; }

  rix-job-e2e:
    name: rix job e2e
    runs-on: ubuntu-latest
    needs: build-rix
    permissions:
      contents: read
    env:
      RIX_BIN: ${{ github.workspace }}/rix-bin/rix
      RIX_REPO: ${{ github.repository }}
      RIX_READ_TOKEN: ${{ github.token }}

    # One level deeper than agent-plumbing above: invokes the built rix binary directly (bypassing
    # the composite-action/workflow layer) and does real JSON parsing on its result, so
    # per-failure-mode assertions live in a proper, reviewable test script
    # (tests/e2e/rix-job-e2e.bats) instead of workflow YAML.
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: tests/e2e
          sparse-checkout-cone-mode: false

      - name: Setup Node (rix installs the coding agent CLI via npm)
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Download rix binary
        uses: actions/download-artifact@v4
        with:
          name: rix-bin
          path: rix-bin

      - name: Make rix binary executable
        run: chmod +x rix-bin/rix

      - name: Install bats
        run: |
          sudo apt-get update
          sudo apt-get install -y bats

      - name: Run rix job e2e tests
        # rix forwards every line the agent CLI prints to stderr (see JobRunner.ForwardLine), and
        # `run` merges that into $output - print it on failure instead of silently discarding it,
        # so a failing assertion here comes with the agent's actual raw output instead of just the
        # failed jq/status check.
        run: bats --print-output-on-failure tests/e2e

  download-rix:
    name: Download rix (release path)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    # The only job that exercises download-rix's actual download. agent-plumbing and rix-job-e2e
    # both hand the actions a locally built binary via rix-bin - which is exactly what
    # download-rix's steps are gated against - so its version resolution, checksum verification
    # and extraction otherwise run nowhere in CI. That gap is why an empty rix-version silently
    # resolving to "latest" survived: the one action that was broken is the one CI never ran.
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false

      - name: Check whether the pinned release is published yet
        id: pin
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          pin="$(grep -oPm1 "(?<=inputs\.rix-version \|\| ')[^']+" .github/actions/download-rix/action.yml)"
          echo "pin=$pin" >> "$GITHUB_OUTPUT"
          # A version-bump PR names a release that Release only cuts after that PR has merged, so
          # between the two the pin legitimately points at nothing. Skip there rather than fail
          # every bump PR - the explicit-version step below still covers the download itself.
          if gh api "repos/$GITHUB_REPOSITORY/releases/tags/$pin" >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "::notice::Pinned release $pin is not published yet - skipped the default-version download."
          fi

      # No `with:` at all - the path every caller takes, and the one that used to reach for
      # whatever release was newest instead of this action's own.
      - name: Download the pinned release (rix-version omitted)
        if: steps.pin.outputs.published == 'true'
        uses: ./.github/actions/download-rix

      - name: Assert the pinned binary landed
        if: steps.pin.outputs.published == 'true'
        env:
          PIN: ${{ steps.pin.outputs.pin }}
        run: |
          [[ -n "${RIX_BIN:-}" ]] || { echo "download-rix exported no RIX_BIN" >&2; exit 1; }
          [[ -x "$RIX_BIN" ]] || { echo "RIX_BIN=$RIX_BIN is not executable" >&2; exit 1; }
          echo "Pinned ($PIN) download OK: $RIX_BIN"

      - name: Clear the first download
        run: rm -rf rix-bin rix-archive.*

      # Covers the download, checksum and extraction unconditionally, including on the bump PRs
      # where the step above skips.
      - name: Download an explicitly requested release
        uses: ./.github/actions/download-rix
        with:
          rix-version: latest

      - name: Assert the explicitly requested binary landed
        run: |
          [[ -n "${RIX_BIN:-}" ]] || { echo "download-rix exported no RIX_BIN" >&2; exit 1; }
          [[ -x "$RIX_BIN" ]] || { echo "RIX_BIN=$RIX_BIN is not executable" >&2; exit 1; }
          echo "Explicit download OK: $RIX_BIN"

  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Build
        run: dotnet build Rix.slnx -c Release

      - name: Test
        run: dotnet test Rix.slnx --no-build -c Release --verbosity normal

  analyze:
    name: Analyze
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Install dotnet-sonarscanner
        run: dotnet tool install --global dotnet-sonarscanner

      - name: Begin SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          dotnet sonarscanner begin \
            /k:"Tim-Pohlmann_rix" \
            /o:"tim-pohlmann" \
            /d:sonar.token="$SONAR_TOKEN" \
            /d:sonar.host.url="https://sonarcloud.io" \
            /d:sonar.cs.opencover.reportsPaths="tests/**/coverage.opencover.xml"

      - name: Build
        run: dotnet build Rix.slnx -c Release

      - name: Test
        run: dotnet test Rix.slnx --no-build -c Release --verbosity normal --collect:"XPlat Code Coverage" -- DataCollectionRunSettings.DataCollectors.DataCollector.Configuration.Format=opencover

      - name: End SonarQube analysis
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: dotnet sonarscanner end /d:sonar.token="$SONAR_TOKEN"

