name: Rix On CI Failure

# Reusable workflow: given a specific workflow run, verifies it actually failed, and if so runs
# the coding agent against a prompt built from the failure (PR, run URL, failing step logs),
# turning its output into PRs.
#
# Three jobs, because the middle one is hostile. `detect` decides whether to act and on which
# branch, holding only a read token; `run` starts the coding agent, which executes code from the
# failing branch and so must be assumed to own that machine outright; `create-pr` holds the write
# token and never shares a machine with the agent. Everything `run` produces - its result.json, its
# bundles, its step outputs - is therefore attacker-controlled, and the only thing `create-pr`
# trusts is what `detect` said before the agent existed. A job cannot write a completed prior job's
# outputs, which is what makes that boundary hold.
#
# Shared by both integration patterns in the README:
#   - a project repo calling it directly from its own workflow_run trigger
#   - a central "factory" repo calling it from a repository_dispatch fired by many project repos
# The factory case can't trust github.event.workflow_run (that context doesn't cross the
# repository_dispatch boundary), so the conclusion — and whether the run's branch belongs to the
# target repo at all, rather than to a fork nobody needs write access to push to — is always
# re-checked here via the API rather than taken from the caller.
on:
  workflow_call:
    inputs:
      repo:
        description: >-
          Target GitHub repo (owner/name) that produced the run. Defaults to the calling repo —
          only the factory pattern (where the dispatching repo differs from the failing one)
          needs to set this explicitly.
        required: false
        type: string
      run-id:
        description: ID of the (possibly failed) workflow run to inspect
        required: true
        type: string
      agent:
        description: "Coding agent to run: 'opencode' (default), 'claude', or 'pi'"
        required: false
        type: string
      model:
        description: >-
          Model identifier passed to the agent CLI via --model (e.g. 'openai/gpt-4o' for
          opencode). Provider-specific; omit to use the agent's own default model (opencode
          picks a free model on its own, needing no API key).
        required: false
        type: string
      agent-api-key-env:
        description: >-
          Name of the environment variable agent-api-key is exported as (e.g. OPENCODE_API_KEY,
          ANTHROPIC_API_KEY, OPENAI_API_KEY, AWS_ACCESS_KEY_ID) — whatever the selected
          provider/model expects. Must end in a credential-shaped suffix (_API_KEY, _TOKEN,
          _ACCESS_KEY_ID, ...). Omit to use a default based on agent: OPENCODE_API_KEY for
          opencode, ANTHROPIC_API_KEY for claude. Required for pi whenever agent-api-key is set,
          since pi has no single default provider to fall back on.
        required: false
        type: string
      rix-version:
        description: "Rix release tag to download, or 'latest'"
        required: false
        type: string
      rix-bin:
        description: "Path to an already-built rix binary to use instead of downloading a release"
        required: false
        type: string
      max-rix-commits:
        description: >-
          How many of rix's own commits may already sit at the failing branch's tip before the
          failure is left alone instead of answered (default: 5, max: 100). Bounds rix reacting to
          the CI failures of its own fixes forever; a commit by anyone else at the tip clears the
          count, so a human stepping in re-enables it.
        required: false
        type: number
      max-tokens:
        description: Coding agent token budget cap
        required: false
        type: number
      timeout:
        description: Wall-clock timeout in minutes
        required: false
        type: number
      runner:
        description: runs-on label for all three jobs (e.g. a self-hosted runner label)
        required: false
        type: string
        default: ubuntu-latest
    secrets:
      read-token:
        description: >-
          GitHub PAT with read access to the target repo. Needs Actions:read in addition to
          contents:read — it's used both to fetch the failing run's metadata and logs and, once a
          failure is confirmed, to clone the repo for the agent.
        required: true
      write-token:
        description: "GitHub PAT with contents:write + pull-requests:write on the target repo"
        required: true
      agent-api-key:
        description: >-
          API key for the selected coding agent's model provider. Optional: leaving model unset
          lets opencode pick its own free default model, needing no key.
        required: false

# Every job only needs read access via GITHUB_TOKEN (the sparse-checkout of the public rix repo).
# All writes to the target repo go through the write-token PAT, never GITHUB_TOKEN — so deny it
# write access explicitly, keeping the untrusted agent run unable to push using the caller token.
permissions:
  contents: read

jobs:
  detect:
    name: Check run
    # inputs.runner like the others: rix-bin is a path on the runner's filesystem, and the release
    # binary is picked per OS/arch, so all three jobs have to land on the same kind of machine.
    runs-on: ${{ inputs.runner }}
    outputs:
      should-run: ${{ steps.detect.outputs.should-run }}
      branch: ${{ steps.detect.outputs.branch }}
    steps:
      # A local `uses: ./...` action reference resolves against whatever is already checked out
      # at github.workspace, so this checkout is required before the composite action below (and
      # its own nested `uses: ./.github/actions/download-rix`) can resolve. `uses:` can't take an
      # expression, so a remote `uses: owner/repo/.github/actions/...@<ref>` reference would need
      # a static ref hardcoded at authoring time - this checkout instead tracks whatever commit is
      # actually running via job.workflow_repository/job.workflow_sha, real (if not yet
      # actionlint-recognized - see https://github.com/rhysd/actionlint/issues/260 for the same lag
      # on job.workflow_ref) context properties that resolve to the repo/commit of *this* reusable
      # workflow file even when called from another repo, unlike github.repository/github.sha
      # (which stay pinned to the calling repo).
      - name: Get rix repo (for local composite actions)
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false

      - name: Detect CI failure
        id: detect
        uses: ./.github/actions/detect-ci-failure
        with:
          repo: ${{ inputs.repo || github.repository }}
          run-id: ${{ inputs.run-id }}
          read-token: ${{ secrets.read-token }}
          # Forwarded raw, 0 and all: detect-ci-failure normalizes the omitted-number-input 0 the
          # same way prepare-rix-env does for max-tokens/timeout, so it holds for every caller of
          # that action rather than only for this workflow.
          max-rix-commits: ${{ inputs.max-rix-commits }}
          rix-version: ${{ inputs.rix-version }}
          rix-bin: ${{ inputs.rix-bin }}

      # The prompt travels as a file rather than a job output for two reasons: it is built from the
      # failing run's log output, so it has no size bound a job output could honour, and keeping it
      # out of $GITHUB_OUTPUT leaves that channel carrying only the short values rix validated -
      # nothing long enough or arbitrary enough to forge a second output alongside it.
      - name: Upload prompt
        if: steps.detect.outputs.should-run == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: rix-prompt
          path: out/prompt.md

  run:
    name: Run rix job
    needs: detect
    if: needs.detect.outputs.should-run == 'true'
    runs-on: ${{ inputs.runner }}
    steps:
      # See the comment on the equivalent step in the `detect` job above - same reasoning applies
      # to every job here.
      - name: Get rix repo (for local composite actions)
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false

      - name: Download prompt
        uses: actions/download-artifact@v4
        with:
          name: rix-prompt
          path: prompt

      - name: Run rix job
        uses: ./.github/actions/run-rix-job
        with:
          repo: ${{ inputs.repo || github.repository }}
          prompt-file: prompt/prompt.md
          read-token: ${{ secrets.read-token }}
          agent: ${{ inputs.agent }}
          model: ${{ inputs.model }}
          agent-api-key: ${{ secrets.agent-api-key }}
          agent-api-key-env: ${{ inputs.agent-api-key-env }}
          # The failing run's own branch, and nothing else: rix is answering a failure there, so
          # that is the only place its answer belongs. Taken from `detect` rather than from
          # anything this job can see, since this job is the one running the untrusted code.
          #
          # This input is a comma-separated list, so a branch whose name contains a comma arrives
          # as two names and rix can't fix it. A functionality gap rather than a hole: getting such
          # a branch into the watched repo takes write access, which is already more than this
          # boundary defends against. The list is due to become a permission file, which is where
          # it will be fixed once rather than patched here.
          allowed-push-branches: ${{ needs.detect.outputs.branch }}
          max-tokens: ${{ inputs.max-tokens }}
          timeout: ${{ inputs.timeout }}
          rix-version: ${{ inputs.rix-version }}
          rix-bin: ${{ inputs.rix-bin }}

      - name: Upload job output
        uses: actions/upload-artifact@v4
        with:
          name: rix-output
          path: out/

  create-pr:
    name: Create PRs
    # Both, not just `run`: the branch this is allowed to push to has to come from `detect`, and a
    # job can only read the outputs of jobs it declares as needs.
    needs: [detect, run]
    runs-on: ${{ inputs.runner }}
    steps:
      # See the comment on the equivalent step in the `detect` job above - same reasoning applies
      # to every job here.
      - name: Get rix repo (for local composite actions)
        uses: actions/checkout@v4
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          sparse-checkout: .github/actions
          sparse-checkout-cone-mode: false

      - name: Download job output
        uses: actions/download-artifact@v4
        with:
          name: rix-output
          path: out

      - name: Submit rix job
        uses: ./.github/actions/submit-rix-job
        with:
          repo: ${{ inputs.repo || github.repository }}
          write-token: ${{ secrets.write-token }}
          # The same branch the `run` job bounded the agent with, read from `detect` rather than
          # from the artifact - which the agent could have rewritten before it was uploaded. This
          # is the one thing the job holding the write token checks, and the only reason the agent
          # getting its own machine is survivable: it may push to the branch whose failure it was
          # answering, and to nothing else.
          allowed-push-branches: ${{ needs.detect.outputs.branch }}
          input-dir: out
          rix-version: ${{ inputs.rix-version }}
          rix-bin: ${{ inputs.rix-bin }}
