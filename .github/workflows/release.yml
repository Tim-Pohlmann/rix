name: Release

# Second half of a release: run the Version Bump workflow for this version first, merge its PR,
# then run this. The bump commit is what gets tagged, and it is the commit whose workflows name
# the binary this release publishes - so tagging anything else would hand callers of this release
# a different release's binary. Forgetting the bump is refused rather than tolerated: a version
# that already has a release can only be re-released with `rerun` explicitly enabled.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release (e.g. v1.2.3)'
        required: true
      rerun:
        description: 'Finish a release that only partly completed for this version (e.g. an asset upload failed). Off by default, so re-running an already-released version is refused instead of republishing it.'
        required: false
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Validate
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          RERUN: ${{ inputs.rerun }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [[ ! "$INPUT_VERSION" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Error: version must match v<major>.<minor>.<patch> with no leading zeros (got: $INPUT_VERSION)"
            exit 1
          fi
          semver="${INPUT_VERSION#v}"
          csproj_version=$(grep -oPm1 '(?<=<Version>)[^<]+' src/Rix/Rix.csproj)
          if [[ "$csproj_version" != "$semver" ]]; then
            echo "Error: version mismatch. Expected $semver but found src/Rix/Rix.csproj=$csproj_version"
            echo "Bump the version first by running the Version Bump workflow with version $INPUT_VERSION."
            exit 1
          fi
          # The bump runs before the release now, so the check above passes just as happily on the
          # version that is already out - it is the same number in both cases. An existing release
          # for it is what distinguishes "forgot to bump" from "ready to release", so refuse that
          # rather than republishing over a release people are already downloading.
          if gh release view "$INPUT_VERSION" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [[ "$RERUN" != "true" ]]; then
              echo "Error: $INPUT_VERSION is already released."
              echo "Run the Version Bump workflow for the next version and merge its PR before releasing."
              echo "To finish a release that only partly completed, re-run this workflow with rerun enabled."
              exit 1
            fi
            echo "rerun enabled: finishing the existing $INPUT_VERSION release."
          fi

      - name: Create tag and GitHub Release
        run: |
          git fetch --tags origin
          # A tag with no release behind it is a release that was started and didn't finish, so
          # carry on and create the release for it. Whether finishing it is what the caller meant
          # is settled in Validate, above; the publish job always builds from the tag, so what
          # ships matches the tag either way, however far the default branch has moved since.
          if git rev-parse --verify "refs/tags/${{ github.event.inputs.version }}" >/dev/null 2>&1; then
            echo "Tag ${{ github.event.inputs.version }} already exists - finishing its release."
          else
            git tag "${{ github.event.inputs.version }}"
            git push origin "${{ github.event.inputs.version }}"
          fi
          gh release create "${{ github.event.inputs.version }}" \
            --title "Rix ${{ github.event.inputs.version }}" \
            --target "$(git rev-parse HEAD)" \
            --generate-notes \
            --repo "$GITHUB_REPOSITORY" \
          || gh release view "${{ github.event.inputs.version }}" --repo "$GITHUB_REPOSITORY" > /dev/null
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish (${{ matrix.rid }})
    needs: create-release
    runs-on: ubuntu-latest
    permissions:
      contents: write

    strategy:
      matrix:
        include:
          - rid: linux-x64
            archive_ext: tar.gz
          - rid: linux-arm64
            archive_ext: tar.gz
          - rid: osx-x64
            archive_ext: tar.gz
          - rid: osx-arm64
            archive_ext: tar.gz
          - rid: win-x64
            archive_ext: zip

    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ github.event.inputs.version }}

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Set version
        id: ver
        env:
          VERSION: ${{ github.event.inputs.version }}
        run: echo "value=${VERSION#v}" >> "$GITHUB_OUTPUT"

      - name: Publish
        run: dotnet publish src/Rix/Rix.csproj -r ${{ matrix.rid }} -c Release -o publish/

      - name: Archive (tar.gz)
        if: matrix.archive_ext == 'tar.gz'
        run: tar -czf rix-${{ steps.ver.outputs.value }}-${{ matrix.rid }}.tar.gz -C publish .

      - name: Archive (zip)
        if: matrix.archive_ext == 'zip'
        run: cd publish && zip -r ../rix-${{ steps.ver.outputs.value }}-${{ matrix.rid }}.zip .

      - name: Checksum
        run: |
          asset="rix-${{ steps.ver.outputs.value }}-${{ matrix.rid }}.${{ matrix.archive_ext }}"
          # Sidecar consumed by .github/actions/download-rix/download-rix.sh to verify the archive before
          # extraction. sha256sum's format is "<hex>  <filename>".
          sha256sum "$asset" > "$asset.sha256"

      - name: Upload asset
        run: |
          asset="rix-${{ steps.ver.outputs.value }}-${{ matrix.rid }}.${{ matrix.archive_ext }}"
          gh release upload "${{ github.event.inputs.version }}" \
            "$asset" "$asset.sha256" --clobber --repo "$GITHUB_REPOSITORY"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tag-major:
    name: Update floating major version tag
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ github.event.inputs.version }}
      - name: Update floating major version tag
        run: |
          VERSION="${{ github.event.inputs.version }}"
          MAJOR="v$(echo "$VERSION" | grep -oP '(?<=^v)\d+')"
          git tag -f "$MAJOR"
          git push origin "$MAJOR" --force
